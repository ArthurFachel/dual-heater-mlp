[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-heater"
version = "0.2.0"
description = "Functional neuron-level plasticity mechanisms for continual learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arthur Fachel" }]
dependencies = [
    "torch>=2.1,<3",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
research = [
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scipy>=1.10",
    "torchvision>=0.16,<0.26",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:CUDA initialization:UserWarning",
]
